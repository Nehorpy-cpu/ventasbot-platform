<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Seguí tu pedido · VentasBot</title>
  <link rel="stylesheet" href="/panel/styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:1rem;background:#10231d}.tracking-card{width:min(680px,100%);padding:clamp(1.3rem,5vw,3rem)}.tracking-card h1{font-size:clamp(2rem,7vw,4rem);letter-spacing:-.06em;margin:.3rem 0}.track-state{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0 1.5rem;border-bottom:1px solid var(--line)}.timeline{display:grid;gap:0;margin-top:1.5rem}.event{display:grid;grid-template-columns:28px 1fr;gap:.8rem;min-height:70px}.dot{width:16px;height:16px;border-radius:50%;background:var(--green);position:relative;margin-top:.15rem}.event:not(:last-child) .dot:after{content:"";position:absolute;width:2px;height:58px;background:#cfe2d7;left:7px;top:15px}.event b,.event small{display:block}.event small{color:var(--muted);margin-top:.25rem}.track-error{color:var(--danger)}
  </style>
</head>
<body>
  <main class="card tracking-card">
    <span class="eyebrow">SEGUIMIENTO EN VIVO</span>
    <h1>Tu pedido</h1>
    <div id="tracking"><p class="muted">Cargando estado…</p></div>
  </main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const token=new URLSearchParams(location.search).get('token');
    const labels={ASSIGNED:'Delivery asignado',PICKED_UP:'Pedido retirado',IN_TRANSIT:'En camino',ARRIVED:'El delivery llegó',DELIVERED:'Pedido entregado',FAILED:'No se pudo entregar',PENDING:'Preparando asignación'};
    async function load(){const target=document.querySelector('#tracking');if(!token){target.innerHTML='<p class="track-error">Falta el código de seguimiento.</p>';return}try{const r=await fetch(`/api/tracking/${encodeURIComponent(token)}`);const data=await r.json();if(!r.ok)throw new Error(data.detail||'Tracking no encontrado');target.innerHTML=`<div class="track-state"><div><small class="muted">PEDIDO</small><b>${esc(data.order_id.slice(-8))}</b></div><span class="badge">${esc(labels[data.delivery_status]||data.delivery_status)}</span></div><div class="timeline">${data.timeline.map(e=>`<div class="event"><i class="dot"></i><div><b>${esc(labels[e.status]||e.status)}</b><small>${new Date(e.created_at).toLocaleString('es-PY')}${e.note?` · ${esc(e.note)}`:''}</small></div></div>`).join('')}</div>`}catch(e){target.innerHTML=`<p class="track-error">${esc(e.message)}</p>`}}load();setInterval(load,15000);
  </script>
</body>
</html>
