services:
  api:
    build: .
    ports: ["8099:8099"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ventasbot:ventasbot@db:5432/ventasbot
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ventasbot
      POSTGRES_USER: ventasbot
      POSTGRES_PASSWORD: ventasbot
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventasbot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
